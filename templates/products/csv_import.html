{% extends "base.html" %}
{% block content %}
<section class="section narrow">
  <h1>CSV Import</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="button">Import</button></form>
  {% for error in errors %}<p class="error">Row {{ error.row }}: {{ error.error }}</p>{% endfor %}
</section>
{% endblock %}
