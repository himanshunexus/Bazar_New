{% with image=product.images.first %}
  <div class="product-media {{ media_class|default:'' }}">
    {% if image %}
      <img class="product-media-photo" src="{{ image.secure_url }}" alt="{{ product.name }}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <div class="product-media-fallback" hidden aria-label="Image unavailable for {{ product.name }}"><span>{{ product.shop.category.icon|default:'🛍️' }}</span><small>{{ product.name }}</small></div>
      {% if show_credit and image.source_url %}<small class="photo-credit"><a href="{{ image.source_url }}" target="_blank" rel="noopener">Photo source: Unsplash</a></small>{% endif %}
    {% else %}
      <div class="product-media-fallback" aria-label="No photo available for {{ product.name }}"><span>{{ product.shop.category.icon|default:'🛍️' }}</span><small>{{ product.name }}</small></div>
    {% endif %}
  </div>
{% endwith %}
