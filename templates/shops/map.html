{% extends "base.html" %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}
{% block content %}
<section class="section">
  <div class="section-head"><div><p class="eyebrow">Local commerce, mapped</p><h1>Shop Map</h1></div><span class="muted">Within your delivery radius</span></div>
  <div class="map-shell">
    <form class="map-location-bar" id="pincode-form" novalidate>
      <label class="sr-only" for="pincode-input">Delivery pincode</label>
      <input id="pincode-input" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit pincode" value="{{ user_pincode }}">
      <button class="button" id="locate-button" type="submit"><span class="button-label">Locate</span><span class="button-spinner" aria-hidden="true"></span></button>
      <button class="button secondary gps-button" id="gps-button" type="button">Use my location</button>
    </form>
    <p class="map-status" id="map-status" role="status" aria-live="polite"></p>
    <div class="map-filters" role="toolbar" aria-label="Filter shops by category"><button class="filter-chip active" data-category="all">All shops</button></div>
    <div id="map" data-default-lat="{{ DEFAULT_LAT }}" data-default-lng="{{ DEFAULT_LNG }}" data-user-pincode="{{ user_pincode }}" data-saved-lat="{{ saved_latitude }}" data-saved-lng="{{ saved_longitude }}"></div>
    <p class="map-fallback" hidden>Map tiles are temporarily unavailable. Shop markers are still listed in the map area; try refreshing shortly.</p>
  </div>
</section>
<script src="{% static 'js/map.js' %}" defer></script>
{% endblock %}
