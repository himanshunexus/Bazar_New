{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}
{% block content %}
<section class="section">
  <div class="section-head"><div><p class="eyebrow">Local commerce, mapped</p><h1>Shop Map</h1></div><span class="muted">Within your delivery radius</span></div>
  <div class="map-shell">
    <div class="map-filters" role="toolbar" aria-label="Filter shops by category"><button class="filter-chip active" data-category="all">All shops</button></div>
    <div id="map"></div>
    <p class="map-fallback" hidden>Map tiles are temporarily unavailable. Shop markers are still listed in the map area; try refreshing shortly.</p>
  </div>
</section>
<script>
  const center = [{{ DEFAULT_LAT }}, {{ DEFAULT_LNG }}];
  const map = L.map('map').setView(center, 13);
  const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors, Tiles style by HOT'}).addTo(map);
  tileLayer.on('tileerror', () => document.querySelector('.map-fallback').hidden = false);
  let shopLayer;
  fetch("{% url 'shops:geojson' %}").then(r => r.json()).then(data => {
    const filterBar = document.querySelector('.map-filters');
    [...new Set(data.features.map(feature => feature.properties.category).filter(Boolean))].sort().forEach(category => {
      const button = document.createElement('button');
      button.className = 'filter-chip';
      button.dataset.category = category;
      button.textContent = category;
      filterBar.appendChild(button);
    });
    shopLayer = L.geoJSON(data, {
      filter: () => true,
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`<strong>${p.name}</strong><br>${p.hours}<br><a href="${p.url}">Open shop</a><br><a href="${p.directions}">Directions</a>`);
      }
    }).addTo(map);
    filterBar.querySelectorAll('.filter-chip').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      const category = button.dataset.category;
      shopLayer.clearLayers();
      L.geoJSON(data, {filter: feature => category === 'all' || feature.properties.category === category, onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`<strong>${p.name}</strong><br>${p.hours}<br><a href="${p.url}">Open shop</a><br><a href="${p.directions}">Directions</a>`);
      }}).addTo(shopLayer);
    }));
  }).catch(() => {
    document.querySelector('.map-fallback').hidden = false;
  });
</script>
{% endblock %}
