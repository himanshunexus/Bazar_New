{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<section class="section">
  <h1>Categories</h1>
  <div class="grid compact">
  {% for category in categories %}
    <a class="tile" href="{% url 'shops:category' category.slug %}"><span>{{ category.icon }}</span>{{ category.name }}</a>
  {% empty %}<p>No categories yet.</p>{% endfor %}
  </div>
</section>
{% endblock %}
