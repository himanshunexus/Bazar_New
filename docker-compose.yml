services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bazar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bazar_pgdata:/var/lib/postgresql/data
  ml:
    build:
      context: ./ml_service
    ports:
      - "8000:8000"
volumes:
  bazar_pgdata:
